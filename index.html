<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Musique avec les doigts</title>

    <style>
        /*
     * On applique box-sizing à tous les éléments.
     * Cela rend les calculs de largeur plus prévisibles.
     */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 2rem;

            font-family: system-ui, sans-serif;
            color: white;
            background: #111827;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 0.8rem 1.2rem;
            border: 0;
            border-radius: 0.6rem;

            font: inherit;
            font-weight: 700;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /*
     * Zone contenant la vidéo et le canvas.
     * Le canvas sera placé par-dessus la vidéo.
     */
        .camera {
            position: relative;

            width: 100%;
            margin-top: 1rem;

            overflow: hidden;
            border: 2px solid #374151;
            border-radius: 1rem;

            background: black;
        }

        video,
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /*
     * On retourne horizontalement la vidéo.
     * Le résultat ressemble ainsi à un miroir.
     */
        video {
            transform: scaleX(-1);
        }

        /*
     * Le canvas est placé exactement au-dessus de la vidéo.
     */
        canvas {
            position: absolute;
            inset: 0;

            /*
       * On retourne également le canvas pour que les points
       * correspondent bien à la vidéo en miroir.
       */
            transform: scaleX(-1);

            /*
       * Le canvas ne doit pas bloquer les clics.
       */
            pointer-events: none;
        }

        #status,
        #detected-fingers {
            min-height: 1.5rem;
        }

        .instructions {
            padding: 1rem;
            margin-block: 1rem;

            border: 1px solid #374151;
            border-radius: 0.8rem;

            background: #1f2937;
        }

        .instructions p {
            margin-block: 0.4rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Musique avec les doigts</h1>

        <div class="instructions">
            <p>Pouce : Do</p>
            <p>Index : Ré</p>
            <p>Majeur : Mi</p>
            <p>Annulaire : Fa</p>
            <p>Auriculaire : Sol</p>
        </div>

        <!--
      Un seul bouton suffit pour :
      1. autoriser la caméra ;
      2. autoriser le son ;
      3. commencer la détection.
    -->
        <button id="start-button" type="button" disabled>
            Activer la caméra et le son
        </button>

        <!--
      Cette zone annonce l’état général de l’application.
      aria-live permet à NVDA de lire les changements importants.
    -->
        <p id="status" role="status" aria-live="polite">
            Chargement du modèle…
        </p>

        <!--
      Cette seconde zone indique les doigts détectés.
      aria-live="off" évite que le lecteur d’écran annonce
      les changements plusieurs dizaines de fois par seconde.
    -->
        <p id="detected-fingers">
            Aucun doigt levé.
        </p>

        <div class="camera">
            <!-- Flux vidéo provenant de la webcam. -->
            <video id="webcam" autoplay playsinline muted aria-label="Retour vidéo de la webcam"></video>

            <!--
        Le canvas sert uniquement à dessiner les points de la main.
      -->
            <canvas id="canvas" aria-hidden="true"></canvas>
        </div>
    </main>

    <script type="module">
        /*
         * On importe MediaPipe directement depuis un CDN.
         *
         * FilesetResolver :
         * charge les fichiers WebAssembly nécessaires.
         *
         * HandLandmarker :
         * détecte les mains et leurs 21 points.
         */
        import {
            FilesetResolver,
            HandLandmarker
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";

        /*
         * ----------------------------------------------------------------
         * RÉCUPÉRATION DES ÉLÉMENTS HTML
         * ----------------------------------------------------------------
         */

        const startButton = document.querySelector("#start-button");
        const statusElement = document.querySelector("#status");
        const detectedFingersElement =
            document.querySelector("#detected-fingers");

        const video = document.querySelector("#webcam");
        const canvas = document.querySelector("#canvas");

        /*
         * Le contexte 2D permet de dessiner dans le canvas.
         */
        const context = canvas.getContext("2d");

        /*
         * ----------------------------------------------------------------
         * VARIABLES MEDIAPIPE ET CAMÉRA
         * ----------------------------------------------------------------
         */

        /*
         * Cette variable contiendra le modèle MediaPipe
         * une fois son chargement terminé.
         */
        let handLandmarker = null;

        /*
         * Indique si la caméra a déjà été démarrée.
         */
        let cameraStarted = false;

        /*
         * On mémorise le temps de la dernière image analysée.
         *
         * Cela évite d’analyser plusieurs fois exactement
         * la même image de la vidéo.
         */
        let lastVideoTime = -1;

        /*
         * ----------------------------------------------------------------
         * VARIABLES AUDIO
         * ----------------------------------------------------------------
         */

        /*
         * L’AudioContext est le moteur audio du navigateur.
         *
         * On ne le crée pas immédiatement, car les navigateurs
         * imposent que le son soit activé après une action humaine,
         * par exemple un clic sur un bouton.
         */
        let audioContext = null;

        /*
         * Chaque doigt correspond à une voix musicale.
         *
         * Une voix contient :
         * - un oscillateur qui produit le son ;
         * - un gain qui contrôle son volume.
         */
        const audioVoices = {};

        /*
         * Fréquences des notes en hertz.
         *
         * Do4    = 261,63 Hz
         * Ré4    = 293,66 Hz
         * Mi4    = 329,63 Hz
         * Fa4    = 349,23 Hz
         * Sol4   = 392 Hz
         */
        const notes = {
            thumb: {
                label: "Pouce",
                note: "Do",
                frequency: 261.63
            },

            index: {
                label: "Index",
                note: "Ré",
                frequency: 293.66
            },

            middle: {
                label: "Majeur",
                note: "Mi",
                frequency: 329.63
            },

            ring: {
                label: "Annulaire",
                note: "Fa",
                frequency: 349.23
            },

            pinky: {
                label: "Auriculaire",
                note: "Sol",
                frequency: 392
            }
        };

        /*
         * On mémorise l’état précédent des doigts.
         *
         * Cette information nous permet de savoir si un doigt :
         * - vient de se lever ;
         * - reste levé ;
         * - vient de se baisser.
         */
        let previousFingerState = {
            thumb: false,
            index: false,
            middle: false,
            ring: false,
            pinky: false
        };

        /*
         * ----------------------------------------------------------------
         * CHARGEMENT DU MODÈLE MEDIAPIPE
         * ----------------------------------------------------------------
         */

        async function loadModel() {
            try {
                statusElement.textContent =
                    "Chargement des fichiers MediaPipe…";

                /*
                 * On charge l’environnement WebAssembly.
                 *
                 * WebAssembly permet d’exécuter le modèle rapidement
                 * directement dans le navigateur.
                 */
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
                );

                statusElement.textContent =
                    "Chargement du modèle de détection des mains…";

                /*
                 * Création du détecteur de mains.
                 */
                handLandmarker = await HandLandmarker.createFromOptions(
                    vision,
                    {
                        baseOptions: {
                            /*
                             * Adresse du fichier contenant le modèle entraîné.
                             */
                            modelAssetPath:
                                "https://storage.googleapis.com/" +
                                "mediapipe-models/hand_landmarker/" +
                                "hand_landmarker/float16/1/" +
                                "hand_landmarker.task",

                            /*
                             * On demande à MediaPipe d’utiliser le GPU
                             * lorsque cela est possible.
                             */
                            delegate: "GPU"
                        },

                        /*
                         * VIDEO signifie que nous analysons un flux vidéo
                         * et non une image unique.
                         */
                        runningMode: "VIDEO",

                        /*
                         * Pour commencer, on ne détecte qu’une seule main.
                         *
                         * Cela rend les règles plus simples.
                         * On pourra ensuite passer cette valeur à 2.
                         */
                        numHands: 1,

                        /*
                         * Seuil minimal pour considérer qu’une main existe.
                         */
                        minHandDetectionConfidence: 0.5,

                        /*
                         * Seuil minimal pour conserver une main détectée.
                         */
                        minHandPresenceConfidence: 0.5,

                        /*
                         * Seuil minimal pour suivre la main entre les images.
                         */
                        minTrackingConfidence: 0.5
                    }
                );

                statusElement.textContent =
                    "Modèle chargé. Tu peux activer la caméra.";

                /*
                 * Le bouton devient utilisable seulement
                 * lorsque le modèle est prêt.
                 */
                startButton.disabled = false;
            } catch (error) {
                console.error("Erreur de chargement MediaPipe :", error);

                statusElement.textContent =
                    "Impossible de charger le modèle MediaPipe.";
            }
        }

        /*
         * ----------------------------------------------------------------
         * CRÉATION DU MOTEUR AUDIO
         * ----------------------------------------------------------------
         */

        function initializeAudio() {
            /*
             * On évite de créer plusieurs AudioContext.
             */
            if (audioContext) {
                return;
            }

            /*
             * Création du moteur audio.
             */
            audioContext = new AudioContext();

            /*
             * On crée une voix différente pour chaque doigt.
             */
            for (const [fingerName, noteData] of Object.entries(notes)) {
                audioVoices[fingerName] = createAudioVoice(
                    noteData.frequency
                );
            }
        }

        /*
         * Crée une voix sonore permanente.
         *
         * L’oscillateur fonctionne constamment,
         * mais son volume commence à zéro.
         */
        function createAudioVoice(frequency) {
            /*
             * L’oscillateur produit une onde sonore.
             */
            const oscillator = audioContext.createOscillator();

            /*
             * Le GainNode contrôle le volume.
             */
            const gain = audioContext.createGain();

            /*
             * Une onde triangulaire est plus douce qu’une onde carrée,
             * mais un peu plus riche qu’une onde sinusoïdale.
             */
            oscillator.type = "triangle";

            /*
             * On configure la fréquence correspondant à la note.
             */
            oscillator.frequency.value = frequency;

            /*
             * Au démarrage, le volume est à zéro.
             * La note est donc silencieuse.
             */
            gain.gain.value = 0;

            /*
             * Connexion du graphe audio :
             *
             * oscillateur → volume → haut-parleurs
             */
            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            /*
             * L’oscillateur commence maintenant.
             *
             * Il restera actif, mais nous modifierons son volume
             * pour l’entendre ou le rendre silencieux.
             */
            oscillator.start();

            /*
             * On retourne les éléments dont nous aurons besoin.
             */
            return {
                oscillator,
                gain
            };
        }

        /*
         * Rend une voix audible.
         */
        function startNote(fingerName) {
            const voice = audioVoices[fingerName];

            /*
             * Sécurité : si la voix n’existe pas, on ne fait rien.
             */
            if (!voice || !audioContext) {
                return;
            }

            /*
             * On annule les changements de volume précédemment programmés.
             */
            voice.gain.gain.cancelScheduledValues(
                audioContext.currentTime
            );

            /*
             * On monte progressivement le volume jusqu’à 0,12.
             *
             * setTargetAtTime évite les clics sonores brutaux.
             */
            voice.gain.gain.setTargetAtTime(
                0.12,
                audioContext.currentTime,
                0.02
            );
        }

        /*
         * Rend une voix progressivement silencieuse.
         */
        function stopNote(fingerName) {
            const voice = audioVoices[fingerName];

            if (!voice || !audioContext) {
                return;
            }

            voice.gain.gain.cancelScheduledValues(
                audioContext.currentTime
            );

            /*
             * Le volume descend progressivement vers zéro.
             */
            voice.gain.gain.setTargetAtTime(
                0,
                audioContext.currentTime,
                0.05
            );
        }

        /*
         * Coupe toutes les notes.
         *
         * Cette fonction est utile lorsqu’aucune main
         * n’est détectée.
         */
        function stopAllNotes() {
            for (const fingerName of Object.keys(notes)) {
                stopNote(fingerName);
            }

            /*
             * On remet également tous les anciens états à false.
             */
            previousFingerState = {
                thumb: false,
                index: false,
                middle: false,
                ring: false,
                pinky: false
            };
        }

        /*
         * ----------------------------------------------------------------
         * DÉMARRAGE DE LA CAMÉRA
         * ----------------------------------------------------------------
         */

        async function startCameraAndAudio() {
            /*
             * On évite de démarrer deux fois la caméra.
             */
            if (!handLandmarker || cameraStarted) {
                return;
            }

            try {
                startButton.disabled = true;

                statusElement.textContent =
                    "Activation du moteur audio…";

                /*
                 * Le son doit être activé après le clic de l’utilisateur.
                 */
                initializeAudio();

                /*
                 * Selon le navigateur, l’AudioContext peut être suspendu.
                 * resume() lui demande explicitement de démarrer.
                 */
                if (audioContext.state === "suspended") {
                    await audioContext.resume();
                }

                statusElement.textContent =
                    "Demande d’accès à la caméra…";

                /*
                 * Demande d’autorisation pour utiliser la webcam.
                 */
                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            /*
                             * facingMode user sélectionne normalement
                             * la caméra dirigée vers l’utilisateur.
                             */
                            facingMode: "user",

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }
                        },

                        /*
                         * Nous n’avons pas besoin du microphone.
                         */
                        audio: false
                    });

                /*
                 * On place le flux de la caméra dans la balise vidéo.
                 */
                video.srcObject = stream;

                /*
                 * On attend que la vidéo connaisse réellement
                 * sa largeur et sa hauteur.
                 */
                await new Promise((resolve) => {
                    video.addEventListener(
                        "loadeddata",
                        resolve,
                        {
                            once: true
                        }
                    );
                });

                /*
                 * Le canvas doit avoir exactement la même résolution
                 * que la vidéo.
                 */
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                cameraStarted = true;

                startButton.textContent =
                    "Caméra et son activés";

                statusElement.textContent =
                    "Place une main devant la caméra.";

                /*
                 * Démarrage de la boucle d’analyse vidéo.
                 */
                predictWebcam();
            } catch (error) {
                console.error(
                    "Erreur pendant le démarrage :",
                    error
                );

                statusElement.textContent =
                    "La caméra ou le son n’a pas pu être activé.";

                startButton.disabled = false;
            }
        }

        /*
         * ----------------------------------------------------------------
         * BOUCLE D’ANALYSE DE LA WEBCAM
         * ----------------------------------------------------------------
         */

        function predictWebcam() {
            /*
             * Si la caméra est arrêtée, on quitte la fonction.
             */
            if (!cameraStarted) {
                return;
            }

            /*
             * On vérifie que la vidéo est passée à une nouvelle image.
             */
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;

                /*
                 * MediaPipe analyse l’image actuelle de la vidéo.
                 */
                const results = handLandmarker.detectForVideo(
                    video,
                    performance.now()
                );

                /*
                 * On traite ensuite les résultats.
                 */
                processResults(results);
            }

            /*
             * Le navigateur rappellera cette fonction
             * avant la prochaine image affichée.
             */
            requestAnimationFrame(predictWebcam);
        }

        /*
         * ----------------------------------------------------------------
         * TRAITEMENT DES RÉSULTATS MEDIAPIPE
         * ----------------------------------------------------------------
         */

        function processResults(results) {
            /*
             * On efface les anciens points du canvas.
             */
            context.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            /*
             * results.landmarks contient la liste des mains.
             *
             * Comme numHands vaut 1, nous aurons au maximum
             * une seule main.
             */
            const hands = results.landmarks ?? [];

            /*
             * Si aucune main n’est détectée :
             * - on coupe les sons ;
             * - on affiche un message ;
             * - on quitte la fonction.
             */
            if (hands.length === 0) {
                stopAllNotes();

                detectedFingersElement.textContent =
                    "Aucune main détectée.";

                return;
            }

            /*
             * On récupère les 21 points de la première main.
             */
            const landmarks = hands[0];

            /*
             * MediaPipe indique normalement si la main est
             * une main gauche ou une main droite.
             */
            const handedness =
                results.handednesses?.[0]?.[0]?.categoryName ??
                "Right";

            /*
             * On dessine les 21 points de la main.
             */
            drawHand(landmarks);

            /*
             * On détermine quels doigts sont levés.
             */
            const currentFingerState = detectRaisedFingers(
                landmarks,
                handedness
            );

            /*
             * On déclenche ou coupe les notes
             * selon l’état de chaque doigt.
             */
            updateMusic(currentFingerState);

            /*
             * On affiche les doigts actuellement levés.
             */
            displayRaisedFingers(currentFingerState);
        }

        /*
         * ----------------------------------------------------------------
         * DÉTECTION DES DOIGTS LEVÉS
         * ----------------------------------------------------------------
         */

        function detectRaisedFingers(landmarks, handedness) {
            /*
             * Pour les quatre doigts principaux, on compare :
             *
             * le bout du doigt
             * avec
             * une articulation située plus bas.
             *
             * Dans une image :
             * - y = 0 correspond au haut ;
             * - y = 1 correspond au bas.
             *
             * Donc :
             * bout.y < articulation.y
             * signifie que le bout est plus haut.
             */

            const indexRaised =
                landmarks[8].y < landmarks[6].y;

            const middleRaised =
                landmarks[12].y < landmarks[10].y;

            const ringRaised =
                landmarks[16].y < landmarks[14].y;

            const pinkyRaised =
                landmarks[20].y < landmarks[18].y;

            /*
             * Le pouce bouge principalement horizontalement.
             *
             * Sa détection dépend donc de la main utilisée.
             */
            let thumbRaised;

            if (handedness === "Right") {
                thumbRaised =
                    landmarks[4].x < landmarks[3].x;
            } else {
                thumbRaised =
                    landmarks[4].x > landmarks[3].x;
            }

            return {
                thumb: thumbRaised,
                index: indexRaised,
                middle: middleRaised,
                ring: ringRaised,
                pinky: pinkyRaised
            };
        }

        /*
         * ----------------------------------------------------------------
         * MISE À JOUR DE LA MUSIQUE
         * ----------------------------------------------------------------
         */

        function updateMusic(currentFingerState) {
            /*
             * On parcourt chacun des cinq doigts.
             */
            for (
                const fingerName of Object.keys(currentFingerState)
            ) {
                /*
                 * État du doigt dans l’image actuelle.
                 */
                const isRaised =
                    currentFingerState[fingerName];

                /*
                 * État du doigt dans l’image précédente.
                 */
                const wasRaised =
                    previousFingerState[fingerName];

                /*
                 * Cas 1 :
                 *
                 * Le doigt est maintenant levé,
                 * mais il ne l’était pas avant.
                 *
                 * Le doigt vient donc de se lever.
                 */
                if (isRaised && !wasRaised) {
                    startNote(fingerName);
                }

                /*
                 * Cas 2 :
                 *
                 * Le doigt n’est plus levé,
                 * mais il l’était avant.
                 *
                 * Le doigt vient donc de se baisser.
                 */
                if (!isRaised && wasRaised) {
                    stopNote(fingerName);
                }
            }

            /*
             * L’état actuel devient l’ancien état
             * pour la prochaine image.
             */
            previousFingerState = {
                ...currentFingerState
            };
        }

        /*
         * ----------------------------------------------------------------
         * AFFICHAGE DES DOIGTS DÉTECTÉS
         * ----------------------------------------------------------------
         */

        function displayRaisedFingers(fingerState) {
            const raisedFingers = [];

            /*
             * On récupère le nom et la note
             * de chaque doigt actuellement levé.
             */
            for (
                const [fingerName, isRaised]
                of Object.entries(fingerState)
            ) {
                if (isRaised) {
                    const noteData = notes[fingerName];

                    raisedFingers.push(
                        `${noteData.label} : ${noteData.note}`
                    );
                }
            }

            /*
             * Si aucun doigt n’est levé.
             */
            if (raisedFingers.length === 0) {
                detectedFingersElement.textContent =
                    "Main détectée, mais aucun doigt levé.";

                return;
            }

            /*
             * Sinon, on affiche les notes actives.
             */
            detectedFingersElement.textContent =
                `Notes actives : ${raisedFingers.join(", ")}.`;
        }

        /*
         * ----------------------------------------------------------------
         * DESSIN DES POINTS DE LA MAIN
         * ----------------------------------------------------------------
         */

        function drawHand(landmarks) {
            /*
             * Couleur intérieure des points.
             */
            context.fillStyle = "#22d3ee";

            /*
             * Couleur du contour des points.
             */
            context.strokeStyle = "#f8fafc";

            /*
             * Épaisseur du contour.
             */
            context.lineWidth = 3;

            /*
             * On dessine chacun des 21 points.
             */
            for (const landmark of landmarks) {
                /*
                 * MediaPipe renvoie des coordonnées comprises
                 * approximativement entre 0 et 1.
                 *
                 * On les convertit en pixels.
                 */
                const x = landmark.x * canvas.width;
                const y = landmark.y * canvas.height;

                context.beginPath();

                /*
                 * Dessin d’un cercle :
                 * - x et y : position ;
                 * - 6 : rayon ;
                 * - 0 à Math.PI * 2 : cercle complet.
                 */
                context.arc(
                    x,
                    y,
                    6,
                    0,
                    Math.PI * 2
                );

                context.fill();
                context.stroke();
            }
        }

        /*
         * ----------------------------------------------------------------
         * ÉVÉNEMENTS ET DÉMARRAGE
         * ----------------------------------------------------------------
         */

        /*
         * Lorsque l’utilisateur clique sur le bouton,
         * on démarre la caméra et le moteur audio.
         */
        startButton.addEventListener(
            "click",
            startCameraAndAudio
        );

        /*
         * On charge automatiquement MediaPipe
         * dès l’ouverture de la page.
         */
        loadModel();
    </script>
</body>

</html>
