<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musique avec les doigts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Musique avec les doigts</h1>

      <section class="instructions" aria-label="Correspondance des doigts et des notes">
        <p>Pouce : Do</p>
        <p>Index : Ré</p>
        <p>Majeur : Mi</p>
        <p>Annulaire : Fa</p>
        <p>Auriculaire : Sol</p>
        <p class="hint">Ferme un doigt pour arrêter sa note.</p>
      </section>

      <button id="start-button" type="button" disabled>Activer la caméra et le son</button>
      <p id="status" role="status" aria-live="polite">Chargement du modèle…</p>
      <p id="detected-hand" aria-live="polite">Aucune main détectée.</p>
      <p id="detected-fingers" aria-live="off">Aucun doigt levé.</p>

      <div class="camera">
        <video id="webcam" autoplay playsinline muted aria-label="Retour vidéo de la webcam"></video>
        <canvas id="canvas" aria-hidden="true"></canvas>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
